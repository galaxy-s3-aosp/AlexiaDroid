name: Android 15 ROM Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Максимальное освобождение места на раннере
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    # 2. Проверка доступного места (в логах будет видно ~100+ ГБ)
    - name: Check Space
      run: df -h

    # 3. Установка необходимых для сборки пакетов
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzip lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    # 4. Настройка утилиты repo и скачивание исходников (Shallow Clone)
    - name: Sync Android 15 Source
      run: |
        mkdir ~/android && cd ~/android
        mkdir ~/.bin
        curl https://googleapis.com > ~/.bin/repo
        chmod a+x ~/.bin/repo
        export PATH=$PATH:~/.bin
        
        # Замените ссылку на нужную вам прошивку Android 15 (например, LineageOS)
        repo init -u https://github.com -b lineage-22.0 --depth=1
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle

    # 5. Сборка (Ограничиваем потоки, чтобы не вылететь по RAM раннера)
    - name: Build ROM
      run: |
        cd ~/android
        export PATH=$PATH:~/.bin
        source build/envsetup.sh
        
        # Замените 'lunch_target' на ваше устройство
        # Флаг -j2 или -j4 нужен, чтобы компилятор не сожрал всю оперативку раннера
        lunch lineage_device-userdebug
        make bacon -j2
